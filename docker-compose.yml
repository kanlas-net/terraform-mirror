# Two instances of the proxy sharing one S3 bucket — the setup the download locks
# exist for. Copy, fill in the credentials, then: docker compose up -d --build
services:
  terraform-mirror-a:
    build: .
    image: terraform-mirror:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TFM_UPSTREAM_URL: https://registry.terraform.io
      TFM_BACKENDS: fs,s3
      TFM_CACHE_DIR: /var/cache/terraform-mirror
      TFM_EXTERNAL_URL: https://tf.example.com
      TFM_TTL_VERSIONS: "3600"
      TFM_LOCK_TTL: "900"
      TFM_LOCK_WAIT: "120"
      TFM_S3_BUCKET: ${TFM_S3_BUCKET}
      TFM_S3_REGION: ${TFM_S3_REGION:-us-east-1}
      TFM_S3_ENDPOINT: ${TFM_S3_ENDPOINT:-}
      TFM_S3_PREFIX: terraform-mirror
      TFM_S3_ACCESS_KEY: ${TFM_S3_ACCESS_KEY}
      TFM_S3_SECRET_KEY: ${TFM_S3_SECRET_KEY}
      # Set to true for AWS/MinIO/R2: uses If-None-Match instead of the write-verify
      # handshake when creating lock objects.
      TFM_S3_CONDITIONAL_LOCKS: ${TFM_S3_CONDITIONAL_LOCKS:-false}
      TFM_ADMIN_TOKEN: ${TFM_ADMIN_TOKEN:-}
    volumes:
      - terraform-mirror-a-cache:/var/cache/terraform-mirror

  terraform-mirror-b:
    extends: terraform-mirror-a
    ports:
      - "8081:8080"
    volumes:
      - terraform-mirror-b-cache:/var/cache/terraform-mirror

volumes:
  terraform-mirror-a-cache:
  terraform-mirror-b-cache:
